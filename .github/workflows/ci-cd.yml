# Pull requests into main: install and build.
# Merge (push) to main: the same build, then deploy dist/ to the Nsure server (nginx).
# Server side: Server/deploy in the Nsure workspace (deploy user, /usr/local/bin/nsure-deploy-fe).
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package build
        if: github.event_name != 'pull_request'
        run: tar -C dist -czf nsure-fe.tgz .

      - name: Keep the build for deployment
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: nsure-fe-dist
          path: nsure-fe.tgz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to server
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://129.151.189.55/
    concurrency:
      group: deploy-nsure-fe
      cancel-in-progress: false
    env:
      DEPLOY_USER: deploy
      # Host and host key are not sensitive, so they may be Actions secrets or Actions variables.
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS || vars.DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nsure-fe-dist

      # Logs where each value was found, never the value itself (GitHub masks secrets as *** anyway).
      - name: Check deploy settings
        env:
          HOST_SECRET: ${{ secrets.DEPLOY_HOST != '' }}
          HOST_VAR: ${{ vars.DEPLOY_HOST != '' }}
          KNOWN_SECRET: ${{ secrets.DEPLOY_KNOWN_HOSTS != '' }}
          KNOWN_VAR: ${{ vars.DEPLOY_KNOWN_HOSTS != '' }}
          KEY_SECRET: ${{ secrets.DEPLOY_SSH_KEY != '' }}
          KEY_VAR: ${{ vars.DEPLOY_SSH_KEY != '' }}
        run: |
          missing=0
          report() { # name, found-as-secret, found-as-variable, must-be-secret
            if [ "$2" = true ]; then
              echo "$1: set (secret)"
            elif [ "$3" = true ] && [ "$4" = yes ]; then
              echo "::error::$1 is saved as a variable, which is shown in plain text. Delete it and add it under Secrets instead."
              missing=1
            elif [ "$3" = true ]; then
              echo "$1: set (variable)"
            else
              echo "::error::$1 is not set as a repository, organisation or 'production' environment secret (Settings > Secrets and variables > Actions > Secrets)"
              missing=1
            fi
          }
          report DEPLOY_HOST "$HOST_SECRET" "$HOST_VAR" no
          report DEPLOY_KNOWN_HOSTS "$KNOWN_SECRET" "$KNOWN_VAR" no
          report DEPLOY_SSH_KEY "$KEY_SECRET" "$KEY_VAR" yes
          [ "$missing" = 0 ]

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload build
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes nsure-fe.tgz \
            "$DEPLOY_USER@$DEPLOY_HOST:incoming/nsure-fe.tgz"

      - name: Publish frontend
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" sudo -n /usr/local/bin/nsure-deploy-fe

      - name: Check the live site
        run: curl -fsS -o /dev/null -w "frontend HTTP %{http_code}\n" "https://$DEPLOY_HOST/"
